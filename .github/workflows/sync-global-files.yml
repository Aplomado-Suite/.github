name: Sync Global Files

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4

      - name: Sync Files via API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            
            const requiredFiles = [
              'LICENCE',
              'CODE_OF_CONDUCT.md',
              'LICENSING.md',
              'SECURITY.md',
              'SUPPORT.md',
              'CONTRIBUTING.md'
            ];
            
            for (const file of requiredFiles) {
              if (!fs.existsSync(file)) {
                throw new Error(`Missing file! Please ensure '${file}' exists in the root of your .github repository.`);
              }
            }
            
            const licenceContent = fs.readFileSync('LICENCE', 'utf8');
            const conductContent = fs.readFileSync('CODE_OF_CONDUCT.md', 'utf8');
            const licensingContent = fs.readFileSync('LICENSING.md', 'utf8');
            const securityContent = fs.readFileSync('SECURITY.md', 'utf8');
            const supportContent = fs.readFileSync('SUPPORT.md', 'utf8');
            const contributingContent = fs.readFileSync('CONTRIBUTING.md', 'utf8');
            
            const filesToSync = [
              { path: 'LICENSE', content: licenceContent },
              { path: 'CODE_OF_CONDUCT.md', content: conductContent },
              { path: 'LICENSING.md', content: licensingContent },
              { path: 'SECURITY.md', content: securityContent },
              { path: 'SUPPORT.md', content: supportContent },
              { path: 'CONTRIBUTING.md', content: contributingContent }
            ];
            
            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org: owner,
              per_page: 100
            });
            
            for (const repo of repos) {
              if (repo.name === '.github' || repo.archived) continue;
              
              console.log(`Syncing files to ${repo.name}...`);
              
              for (const file of filesToSync) {
                let sha;
                try {
                  const { data } = await github.rest.repositories.getContent({
                    owner,
                    repo: repo.name,
                    path: file.path
                  });
                  sha = data.sha;
                  
                  if (Buffer.from(data.content, 'base64').toString('utf8') === file.content) {
                    continue;
                  }
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
                
                await github.rest.repositories.createOrUpdateFileContents({
                  owner,
                  repo: repo.name,
                  path: file.path,
                  message: 'chore: sync global community files [skip ci]',
                  content: Buffer.from(file.content).toString('base64'),
                  sha,
                  committer: {
                    name: 'MrTekPet22',
                    email: 'tekpetdigital@duck.com'
                  },
                  author: {
                    name: 'MrTekPet22',
                    email: 'tekpetdigital@duck.com'
                  }
                });
              }
            }
